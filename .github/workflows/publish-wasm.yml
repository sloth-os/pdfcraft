# Publish the wasm build of PdfCraft (github.com/storytold/pdfcraft) to this repository's GitHub
# Pages site: https://sloth-os.github.io/pdfcraft/
#
# This repository holds none of PdfCraft's source. The workflow checks out upstream PdfCraft (its
# newest release by default), builds apps/pdfcraft-web the way the official web release is built —
# the "web" job of storytold/craft-common-actions' release.yml: stable Rust with the
# wasm32-unknown-unknown target, Trunk 0.21.14, the craft-i18n checkout pinned by the app's
# craft-i18n.rev, and (the release recipe's web-craft-fonts option) the craft-fonts checkout
# pinned by PdfCraft's own release.yml, so the wasm embeds the fallback fonts and Edit text works
# for Japanese, Arabic, Thai, Hebrew and Devanagari text. Before the build it applies this
# repository's Simplified Chinese web-fallback patch (patches/) — upstream reads craft-fonts'
# separate Chinese manifest in native builds only, and the patch adds the opt-in
# (CRAFT_FONTS_WEB_HANS) that lets the wasm build embed that face too, so Edit text also works
# for Simplified Chinese. Since v0.20.0 the app also ships Scan & OCR on the web, whose models
# the page downloads from models/ beside index.html on first use; the workflow stages them
# there the way upstream's own web packaging does. On top of the static site Trunk leaves
# in dist/web, the workflow applies this repository's PWA layer (pwa/) — the web app manifest,
# upstream's own app icon in the sizes installers ask for, and a service worker that caches the
# build for offline use; see pwa/README.md — before deploying. Every URL in the generated
# index.html is relative (public_url = "./" in apps/pdfcraft-web/Trunk.toml), and the PWA layer
# keeps to relative URLs too, so the site works under the /pdfcraft/ path this repository's Pages
# serves it from.

name: Publish PdfCraft wasm to Pages

on:
  # The publishing configuration lives in this repository, so a push to main republishes the site.
  push:
    branches: [main]
  # PdfCraft releases often; rebuild the newest release once a day. GitHub disables schedules
  # after 60 days without repository activity — a manual run still works, and the schedule can be
  # re-enabled from the repository's Actions tab.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pdfcraft-ref:
        description: "storytold/pdfcraft ref to build (branch, tag or SHA). Empty: the newest release, falling back to main."
        type: string
        required: false
        default: ""

# The token deploys to Pages; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build the wasm site and deploy it
    # A fork does not have this organization's Pages site, so it must not try to deploy to one.
    if: github.repository == 'sloth-os/pdfcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Resolve which PdfCraft ref to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: the input is caller-controlled.
          PDFCRAFT_REF: ${{ inputs.pdfcraft-ref }}
        run: |
          set -euo pipefail
          ref=""
          if [[ -n "$PDFCRAFT_REF" ]]; then
            ref="$PDFCRAFT_REF"
            echo "building storytold/pdfcraft at the requested ref: $ref"
          else
            # Pushes and the schedule build the newest upstream release, so the site shows a
            # released version, not a snapshot of main. Fall back to main when no release can be
            # read (rate limit, network trouble).
            ref=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  https://api.github.com/repos/storytold/pdfcraft/releases/latest \
                  | jq -r '.tag_name // empty' || true)
            if [[ -z "$ref" ]]; then
              echo "::warning::could not resolve the newest storytold/pdfcraft release; building main"
              ref="main"
            fi
            echo "building the newest storytold/pdfcraft release: $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out PdfCraft
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/pdfcraft
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      # Upstream is checked out at the workspace root, so this repository's own files are not in
      # the workspace yet. Two things live here: the Simplified Chinese web-fallback patch
      # (patches/), applied to the upstream checkout before the build, and the PWA layer applied
      # after it — the manifest, the icons, the service worker and the scripts that add and test
      # them (pwa/). Bring both in at publisher/.
      - name: Check out this repository's publishing layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher
          persist-credentials: false

      # This repository's one change to PdfCraft's source: patches/simplified-chinese-web-fallback
      # .patch, generated against v0.20.0. Upstream reads craft-fonts' separate Simplified Chinese
      # manifest — the LXGW WenKai Lite face Edit text falls back to for Simplified Chinese — in
      # native builds only; the patch adds the CRAFT_FONTS_WEB_HANS opt-in that lets a wasm build
      # embed that face too, plus the tests that keep the opt-in honest (patches/README.md has the
      # whole story). The check first is the point: when a future release moves the patched lines,
      # this step fails loudly instead of the build quietly shipping a site whose Simplified
      # Chinese support vanished — the patch then needs regenerating against that release.
      - name: Apply the Simplified Chinese web-fallback patch
        env:
          # Caller-influenced (workflow_dispatch), so through env, never interpolated.
          PDFCRAFT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if ! git apply --check publisher/patches/simplified-chinese-web-fallback.patch; then
            echo "::error::the Simplified Chinese web-fallback patch no longer applies to storytold/pdfcraft at $PDFCRAFT_REF; regenerate it against that release (patches/README.md)"
            exit 1
          fi
          git apply publisher/patches/simplified-chinese-web-fallback.patch
          git diff --stat

      # The wasm build embeds the fallback fonts of the optional craft-fonts input (without them,
      # Edit text refuses Japanese text — the error names CRAFT_FONTS_DIR). PdfCraft's own release
      # recipe pins craft-fonts in its release.yml; read that pin so it tracks upstream, falling
      # back to the pin of v0.20.0 (2026-11-09) if the file ever changes shape.
      - name: Read the craft-fonts pin from PdfCraft's release recipe
        id: fonts
        run: |
          set -euo pipefail
          fonts_ref=$(awk '/craft-fonts-ref/ { if (match($0, /[0-9a-f]{40}/)) { print substr($0, RSTART, RLENGTH); exit } }' \
            .github/workflows/release.yml || true)
          if [[ -z "$fonts_ref" ]]; then
            echo "::warning::could not read the craft-fonts pin from PdfCraft's release.yml; using the pin of v0.20.0"
            fonts_ref="b076417b5880bd4154bd22f00695b1d28c6bea83"
          fi
          echo "craft-fonts pin: $fonts_ref"
          echo "fonts-ref=$fonts_ref" >> "$GITHUB_OUTPUT"

      # Same toolchain as the official web release: stable, plus the wasm target.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages-wasm

      # Downloads Trunk 0.21.14 and verifies it against the SHA-256 pinned in the action.
      - uses: storytold/craft-common-actions/actions/install-trunk@8e9b8b96c5d64c54eba462f5e8cac196787e744d # main, 2026-11-07
        with:
          trunk-version: "0.21.14"

      # The release recipe's web-craft-fonts option: check out the pinned craft-fonts, and the
      # build embeds its fonts. The build.rs of crates/fonts embeds the wasm subset on wasm32 —
      # the Japanese fallback face BIZ UDPGothic Regular and the small Arabic/Thai/Hebrew/
      # Devanagari faces, about 6 MiB, plus (behind the patch's CRAFT_FONTS_WEB_HANS, below) the
      # Simplified Chinese face LXGW WenKai Lite, about 13 MiB — and CRAFT_FONTS_REQUIRED=1 makes
      # a bad checkout fatal instead of quietly shipping the degraded build again.
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@8e9b8b96c5d64c54eba462f5e8cac196787e744d # main, 2026-11-07
        with:
          ref: ${{ steps.fonts.outputs.fonts-ref }}

      # Checks out storytold/craft-i18n at the rev in craft-i18n.rev and sets CRAFT_I18N_DIR and
      # CRAFT_I18N_REQUIRED=1, so the interface ships with its translations.
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@8e9b8b96c5d64c54eba462f5e8cac196787e744d # main, 2026-11-07

      # CRAFT_FONTS_WEB_HANS is the patch's opt-in: without it a wasm build skips craft-fonts'
      # separate Simplified Chinese manifest even when CRAFT_FONTS_REQUIRED=1 (upstream keeps the
      # face native-only for size), so the embedded fonts stay exactly the official web build's.
      - name: Build the wasm site
        working-directory: apps/pdfcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CRAFT_FONTS_WEB_HANS: "1"
        run: trunk build --release

      # The outcome guard of the patch above: the site is good only if the Chinese manifest's
      # faces are actually in the artifact, whatever the mechanism did between the patch and
      # the file — a lost env var, a manifest that changed shape, a size cap that now skips
      # the face. wasm-opt splits the faces' data segments, so the script reassembles the
      # module's linear memory and hashes each face there against the sha256 pinned in the
      # manifest, a pin the build itself never checks. patches/verify-embedded-face.py
      # documents the why; it exits nonzero — failing the deploy — when a face is missing.
      - name: Verify the Simplified Chinese faces are embedded
        run: python3 publisher/patches/verify-embedded-face.py dist/web craft-fonts

      # v0.20.0's Scan & OCR downloads its models from models/ beside index.html the first time
      # the feature is used. Upstream's own web packaging stages them there (packaging/web/
      # package.sh's stage_models): `cargo xtask models` — an alias upstream's .cargo/config.toml
      # defines — fetches every model named in upstream's ATTRIBUTION.toml, verifies each against
      # the sha256 pinned there, and writes the attribution and licence files the models'
      # CC-BY-SA-4.0 licence requires. The guard mirrors upstream's own stage_models: the step
      # fails unless the attribution and every model's licence text came out with the models.
      - name: Stage the OCR models
        run: |
          set -euo pipefail
          cargo xtask models dist/web/models
          ls dist/web/models/*.LICENCE.txt dist/web/models/ATTRIBUTION.txt >/dev/null
          ls -l dist/web/models

      # PdfCraft is MIT OR Apache-2.0; redistribution carries its notices. The embedded craft-fonts
      # faces are OFL-1.1, whose licence must ship with them. The release zip does both through
      # copy_docs/copy_font_licences in packaging/env.sh.
      - name: Ship PdfCraft's licence files and build info with the site
        env:
          # Caller-influenced (workflow_dispatch), so through env, never interpolated.
          PDFCRAFT_REF: ${{ steps.ref.outputs.ref }}
          PDFCRAFT_COMMIT: ${{ steps.checkout.outputs.commit }}
          FONTS_REF: ${{ steps.fonts.outputs.fonts-ref }}
        run: |
          set -euo pipefail
          for f in LICENSE-MIT LICENSE-APACHE NOTICE; do
            if [[ -f "$f" ]]; then cp "$f" dist/web/; echo "dist/web/$f"; fi
          done
          # The PWA layer ships upstream's own app icon; its licence names it and travels with
          # it, like PdfCraft's other licence files.
          if [[ -f assets/app-icon/LICENSE.txt ]]; then
            cp assets/app-icon/LICENSE.txt dist/web/LICENSE-app-icon.txt
            echo "dist/web/LICENSE-app-icon.txt"
          fi
          # fonts/<family>/OFL.txt -> OFL-<family>.txt, as copy_font_licences packs them.
          for f in craft-fonts/fonts/*/OFL.txt; do
            if [[ -f "$f" ]]; then
              family="$(basename "$(dirname "$f")")"
              cp "$f" "dist/web/OFL-$family.txt"
              echo "dist/web/OFL-$family.txt"
            fi
          done
          # Provenance: which upstream build the published site is. The patch is this repository's
          # one change to that source, so it is named too.
          printf 'Built from github.com/storytold/pdfcraft\nref:    %s\ncommit: %s\nfonts:  craft-fonts %s\npatch:  simplified-chinese-web-fallback (CRAFT_FONTS_WEB_HANS)\n' \
            "$PDFCRAFT_REF" "$PDFCRAFT_COMMIT" "$FONTS_REF" > dist/web/BUILD.txt
          cat dist/web/BUILD.txt

      # This repository's PWA layer, on top of upstream's build: the web app manifest (with the
      # file_handlers that register the installed app as an OS-level PDF handler), the icons
      # (upstream's own app icon; its licence ships above), the theme colour, the registration
      # of the offline-caching service worker, and the launchQueue consumer that delivers a
      # PDF opened from the OS to the app. apply.py copies the layer into dist/web and injects
      # the links and scripts into index.html; pwa/README.md explains the design.
      - name: Add the PWA layer
        run: python3 publisher/pwa/apply.py dist/web

      # The layer's harness: static checks on the applied site (the injected links, the icons,
      # the manifest's file handler, the OCR worker's file chain, the staged models), then sw.js
      # driven through a mock service-worker environment — warm-up caching, the all-or-nothing
      # build swap, offline navigation, the models' network-first serving, and the files that
      # must bypass the worker — and the launchQueue consumer driven through a mock page: a
      # launch before the canvas exists waits and retries until the app's drop listener is up,
      # then delivers the files as one drop.
      - name: Test the PWA layer
        run: node publisher/pwa/test-pwa.mjs dist/web

      - name: The site must use relative URLs
        run: |
          # The same guard as packaging/web/package.sh, on the finished page — upstream's build
          # plus the PWA layer's own links: Pages serves the site under /pdfcraft/, so a
          # root-absolute URL would point outside it and 404.
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "::error::dist/web/index.html has root-absolute URLs; they would break under the /pdfcraft/ path"
            exit 1
          fi
          echo "dist/web/index.html uses relative URLs; the site works under any path prefix."

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Job summary
        env:
          REF: ${{ steps.ref.outputs.ref }}
          COMMIT: ${{ steps.checkout.outputs.commit }}
          FONTS_REF: ${{ steps.fonts.outputs.fonts-ref }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          # The ref can be caller-supplied (workflow_dispatch); keep markdown-hostile characters
          # out of the summary table.
          ref_display=$(printf '%s' "$REF" | tr -d '`' | tr '|' '/')
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next } in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          {
            echo "### PdfCraft wasm published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| PdfCraft ref | \`$ref_display\` |"
            echo "| Upstream commit | \`$COMMIT\` |"
            echo "| craft-fonts | \`$FONTS_REF\` |"
            echo "| zh-Hans patch | simplified-chinese-web-fallback |"
            echo "| Version | $version |"
            echo "| Site | $PAGE_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
